[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hebra"
dynamic = ["version"]
description = "Repository-aware context engine for AI coding agents. The right context. Nothing extra."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anvit Devadiga" }]
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.9,<1"]
keywords = ["context", "retrieval", "bm25", "code-search", "llm", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "build==1.6.1",
    "mypy==2.4.1",
    "markdown-it-py==4.2.0",
]

[project.scripts]
hebra = "hebra.cli:main"

[project.urls]
Repository = "https://github.com/AnvitDevadiga/hebra"

[tool.hatch.version]
path = "src/hebra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hebra"]

[tool.hatch.build.targets.sdist]
include = ["src/hebra", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess call: git is invoked with fixed argv, no shell
    "S608",  # SQL is built only from internal constants; values are bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
files = ["src/hebra"]
