name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # tiktoken downloads each encoding file once; cache it so runs do not
  # depend on fetching it from the network every time.
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache tiktoken encodings
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-o200k-cl100k-v1
      - name: Install
        run: python -m pip install -e .
      - name: Benchmark records validate and summaries are reproducible
        run: |
          for run in v1-dev v1-heldout v2-dev v2-heldout; do
            python benchmarks/summarize.py "benchmarks/results/$run" benchmarks/tasks/v1.jsonl > /dev/null
          done
          git diff --exit-code -- benchmarks/results
      - name: Website data is up to date
        run: python scripts/build_site_data.py --check

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check-links

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache tiktoken encodings
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-o200k-cl100k-v1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch tokenizer encodings (no-op when cached)
        run: python -c "import tiktoken; [tiktoken.get_encoding(e) for e in ('o200k_base', 'cl100k_base')]"
      - name: Pytest
        run: pytest -v
      - name: Memory freshness scenarios
        run: |
          python benchmarks/memory_freshness.py /tmp/memory-freshness
          python -c "import json, sys; r = json.load(open('/tmp/memory-freshness/results.json')); sys.exit(r['correct'] != r['scenarios'])"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache tiktoken encodings
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-o200k-cl100k-v1
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build
          ls -l dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: CLI smoke test
        run: |
          set -euo pipefail
          export PATH=/tmp/smoke/bin:$PATH
          cd /tmp
          hebra --version
          hebra index "$GITHUB_WORKSPACE"
          hebra stats "$GITHUB_WORKSPACE"
          hebra search "$GITHUB_WORKSPACE" --task "token budget packing" --limit 5
          hebra pack "$GITHUB_WORKSPACE" --task "token budget packing" --budget 2000 \
            --format json -o /tmp/pack.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/pack.json"))
          used, limit = report["budget"]["used"], report["budget"]["limit"]
          assert used <= limit, (used, limit)
          assert report["selected"], "expected at least one fragment"
          assert all(s["source_status"] == "current" for s in report["selected"])
          print(f"pack ok: {len(report['selected'])} fragments, {used}/{limit} tokens")
          EOF
          hebra graph "$GITHUB_WORKSPACE" pack_context --json > /tmp/graph.json
          # Memory is checked on the small example repository, where the
          # outcome does not depend on how much code this repository contains.
          cp -R "$GITHUB_WORKSPACE/examples/demo-shop" /tmp/demo-shop
          cd /tmp/demo-shop
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm demo
          hebra index .
          hebra memory add . --memory-db /tmp/memory.sqlite3 --kind fact \
            --text "Payment charges retry with backoff" --ref shop/payments.py:12-21
          hebra memory list . --memory-db /tmp/memory.sqlite3 --json > /tmp/memory.json
          hebra pack . --task "retry payment charges" --budget 1500 \
            --retrieval bm25_graph --strategy optimized --memory \
            --memory-db /tmp/memory.sqlite3 --trace --format json -o /tmp/pack2.json
          cd /tmp
          python - <<'EOF'
          import json
          graph = json.load(open("/tmp/graph.json"))
          assert graph["matches"][0]["outgoing"], "expected edges for pack_context"
          memory = json.load(open("/tmp/memory.json"))
          assert memory[0]["status"] == "current", memory
          report = json.load(open("/tmp/pack2.json"))
          assert report["budget"]["used"] <= report["budget"]["limit"]
          assert report["method"]["retrieval"] == "bm25_graph"
          assert report["method"]["strategy"] == "optimized"
          assert report["memory"]["selected"], "expected the verified memory record"
          print("graph, memory, and optimized pack ok")
          EOF
